<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-Report</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>
    <div id="main">
      <h1>WEATHER REPORT ⛅</h1>
<input type="text" id="city" placeholder="eg.hyderabad"/>
<button onclick="getweather()">search</button><br>
<div id="result">search valid city</div><br><br>
    </div>
    
    <script >

    
 async function getweather(){
    try{
    const city=document.getElementById("city").value;

    const Apikey="1dfe32a5475cd06c22e321e14824a6d0";

    const ApiUrl=`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${Apikey}&units=metric`

    const response= await fetch(ApiUrl)
    console.log(response)

if(!response.ok){
   throw new Error("Search Valid City")
}
const data= await response.json()
    document.getElementById("result").innerHTML=`
<h3> ${data.name}<h3/>
    <p><strong>Temparature : </strong>${data.main.temp}</p>
    <p><strong>Condition : </strong>${data.weather[0].main}(${data.weather[0].discription})</p>
<p><strong>Humidity : </strong>${data.main.humidity}</p>
<p><strong>Wind Speed : </strong>${data.wind.speed}</p>
`;
    }
catch(error){
    console.log("error",error)
    document.getElementById("result").innerHTML=error
    // document.getElementById("result").innerHTML="Error fetching weather Data"
}

}
    </script>
    
</body>
</html>
